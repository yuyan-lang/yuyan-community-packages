# 文档站：在 GitHub 托管运行机上出 docs.yuyan-lang.org（官网 yuyan-lang.org 的静态版，只有包列表页挂一段原生 JS 搜索，两站同一批页面，另有全部社区包的包页），
# 上传到 Cloudflare Pages 项目 yuyan-docs。官网的源码在语言仓 应用/书院/门庭/（门庭即官网），全部公开，这里只用公开源码构建。
# 触发：合入机器人每合入一个拉取请求就显式触发（包改了、钉换了，docs 站都要跟着变），复制机器人推来新的 语言仓/<提交> 分支（语言仓 CI
# 又过了一轮、出了新工具链），以及构建发布跑完、维护者推送改了包、工具链钉或本文件、手动触发。
# 工具链与源码：docs 站不等复制拉取请求合入。工具链取 main 与各 语言仓/<提交> 分支的工具链钉里最新的一份（按工具链包文件名里的提交时间比），
# 源码取同一个语言仓提交：仓库目标编在豫构里，源码与跑目标的豫构须是同一提交，「文档站」各步才与源码对得上。包页用 main 的 包/（已发布的包）。
# 复制拉取请求卡在某个包的测试上时，docs 站照样跟上语言仓 CI 最近通过的提交。手动触发可用输入 source 另指源码提交（须与工具链的仓库目标一致）。
# 只进不退：上回发布的源码比最新工具链的提交还新（手动另指过），自动触发就沿用上回那一组工具链与源码，直到有不比它旧的工具链。
# 跳过：（工具链的语言仓提交，源码的语言仓提交，本仓库提交）这一组已经发布过就跳过（手动触发照发）。
# 做法：解开工具链包，用包里的豫构跑语言仓的仓库目标「文档站」（写出 语言仓/dist/文档站），再 wrangler pages deploy。环境变量 豫言社区包目录
# 指向本仓库的 包/、豫言社区包提交 给本仓库提交号，语言仓「网站资料生成」据此出 /包/ 下的包页。包不能拷进语言仓目录树：语言仓找包时连 dist/
# 底下也扫，同名包会报包名冲突。编译缓存放在工作区的 文档站缓存/，跨轮保留。
# 机密：CLOUDFLARE_API_TOKEN（只授 yuyan-docs 所在账户的 Cloudflare Pages 编辑权限）与 CLOUDFLARE_ACCOUNT_ID（账户令牌认不出账户，要它）；
# 没有令牌时只演练：照样出站，存为构件「文档站」，不上传。
name: 文档站

on:
  workflow_run:
    workflows: [构建发布]
    types: [completed]
  push:
    branches: [main, '语言仓/**']
    paths: ['包/**', '工具链钉。数据。豫', '.github/workflows/文档站.yml']
  workflow_dispatch:
    inputs:
      source:
        description: 源码用语言仓的哪个提交（完整提交号或分支名；缺省取工具链的提交）。仓库目标编在豫构里，所指提交的仓库目标须与工具链的相同
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: 文档站
  cancel-in-progress: true

jobs:
  docs:
    name: 出 docs 站并上传
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # 最近一次发布的记号，只为知道上回发布的工具链与源码（见下一步）；这个键从不命中，取的是前缀相同里最新的一份。
      - name: 取上回发布的记号
        uses: actions/cache/restore@v4
        with:
          path: 文档站记号
          key: 文档站已发-上回-${{ github.run_id }}
          restore-keys: 文档站已发-

      # 复制拉取请求合入之前，新工具链只写在它的 语言仓/<提交> 分支的钉里；取 main 与这些分支里最新的一份。
      - name: 选工具链与源码
        id: pin
        env:
          YY_SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin '+refs/heads/语言仓/*:refs/remotes/origin/语言仓/*'
          pin_field() { printf '%s\n' "$1" | sed -n "s/^「$2」者『\(.*\)』也。$/\1/p"; }
          # 记号里依次是工具链提交、源码提交、本仓库提交、工具链网址、沙二五六；只有两项的旧记号不算。
          last_tool=""; last_source=""; last_url=""; last_sha=""
          if [ -s 文档站记号/提交 ]; then
            read -r f1 f2 f3 f4 f5 < 文档站记号/提交 || true
            if [ -n "${f3:-}" ]; then last_tool="$f1"; last_source="$f2"; last_url="${f4:-}"; last_sha="${f5:-}"; fi
          fi
          best=""; best_pin=""; best_ref=""
          for ref in main $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/语言仓/); do
            if [ "$ref" = main ]; then pin="$(cat 工具链钉。数据。豫)"; else pin="$(git show "$ref:工具链钉。数据。豫" 2>/dev/null || true)"; fi
            url="$(pin_field "$pin" 原生工具链网址)"
            if [ -z "$last_url" ] && [ -n "$last_tool" ] && [ "$(pin_field "$pin" 语言仓提交)" = "$last_tool" ]; then
              last_url="$url"; last_sha="$(pin_field "$pin" 原生工具链沙二五六)"
            fi
            ts="$(basename "$url" | grep -oE '^[0-9]{8}T[0-9]{6}Z' || true)"
            if [ -n "$ts" ] && [[ "$ts" > "$best" ]]; then best="$ts"; best_pin="$pin"; best_ref="$ref"; fi
          done
          url="$(pin_field "$best_pin" 原生工具链网址)"
          sha="$(pin_field "$best_pin" 原生工具链沙二五六)"
          tool="$(pin_field "$best_pin" 语言仓提交)"
          if [ -n "$YY_SOURCE" ]; then
            if printf '%s' "$YY_SOURCE" | grep -qE '^[0-9a-f]{40}$'; then
              commit="$YY_SOURCE"
            else
              commit="$(git ls-remote https://github.com/yuyan-lang/yuyan "$YY_SOURCE" | head -n 1 | cut -f1)"
            fi
          else
            commit="$tool"
            # 只进不退：上回发布的源码比最新工具链的提交还新，就沿用上回那一组工具链与源码。
            if [ -n "$last_source" ] && [ -n "$last_url" ] && [ -n "$last_sha" ] && [ "$last_source" != "$tool" ]; then
              rel="$(gh api "repos/yuyan-lang/yuyan/compare/$tool...$last_source" --jq .status 2>/dev/null || true)"
              if [ "$rel" = ahead ]; then
                echo "上回发布的源码 $last_source 比最新工具链的提交 $tool 新，沿用上回的工具链（语言仓 $last_tool）与源码"
                url="$last_url"; sha="$last_sha"; tool="$last_tool"; commit="$last_source"
              fi
            fi
          fi
          if [ -z "$url" ] || [ -z "$sha" ] || [ -z "$tool" ] || [ -z "$commit" ]; then
            echo "::error::没选出工具链钉（原生工具链网址、原生工具链沙二五六、语言仓提交），或认不出输入 source「$YY_SOURCE」"
            exit 1
          fi
          echo "工具链：$best_ref 的钉（语言仓 $tool，$best）；源码：语言仓 $commit；本仓库提交：$(git rev-parse HEAD)"
          {
            echo "url=$url"
            echo "sha=$sha"
            echo "tool=$tool"
            echo "commit=$commit"
            echo "community=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # 发布成功后存一条以（工具链提交，源码提交，本仓库提交）为键的空缓存作记号；记号在就是这一组已经发布过。
      - name: 查这一组提交发布过没有
        id: done
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: 文档站记号
          key: 文档站已发-${{ steps.pin.outputs.tool }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.community }}
          lookup-only: true

      - name: 检出语言仓（源码提交）
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: yuyan-lang/yuyan
          ref: ${{ steps.pin.outputs.commit }}
          path: 语言仓
          fetch-depth: 1
          persist-credentials: false

      - name: 下载并核对原生工具链包
        if: steps.done.outputs.cache-hit != 'true'
        env:
          YY_PIN_URL: ${{ steps.pin.outputs.url }}
          YY_PIN_SHA256: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/yuyan-native.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$archive" "$YY_PIN_URL"
          echo "$YY_PIN_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C 语言仓
          test -x 语言仓/豫构稳定。林纳。豫行

      # 编译缓存跨轮保留：同一个源码提交的各轮共用，换了提交先取最近一份再补编。
      - name: 恢复编译缓存
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: 文档站缓存
          key: 文档站缓存-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.community }}
          restore-keys: |
            文档站缓存-${{ steps.pin.outputs.commit }}-
            文档站缓存-

      # 静态渲染程序（网页沙盘里跑真实的页面应用）编成网页汇编，在诺驿上运行，与语言仓 CI 用同一版诺驿。
      - uses: actions/setup-node@v4
        if: steps.done.outputs.cache-hit != 'true'
        with:
          node-version: 26

      - name: 出 docs 站（仓库目标「文档站」）
        if: steps.done.outputs.cache-hit != 'true'
        working-directory: 语言仓
        env:
          YY_COMMUNITY: ${{ steps.pin.outputs.community }}
        run: |
          set -euo pipefail
          echo "包数：$(find "$GITHUB_WORKSPACE/包" -name '*。包。豫' | wc -l)"
          env 豫言缓存目录="$GITHUB_WORKSPACE/文档站缓存" 豫言社区包目录="$GITHUB_WORKSPACE/包" 豫言社区包提交="$YY_COMMUNITY" \
            ./豫构稳定。林纳。豫行 目标 文档站 -j "$(nproc)"
          test -s dist/文档站/index.html
          echo "文件数：$(find dist/文档站 -type f | wc -l)"
          # docs 站只许包列表页挂一段包搜索脚本（用户 2026-10-27 定），别的脚本一律不许；收尾的核对也查这一条。
          bad="$(grep -rIo --include='*.html' '<script[^>]*>' dist/文档站 | grep -v 'src="/资源/包搜索.js"' || true)"
          if [ -n "$bad" ]; then
            echo "$bad" | head -n 5
            echo "::error::docs 站里只许包列表页的包搜索脚本"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.done.outputs.cache-hit != 'true'
        with:
          name: 文档站
          path: 语言仓/dist/文档站
          retention-days: 14
          if-no-files-found: error

      - name: 上传 Cloudflare Pages（没有令牌时演练）
        id: deploy
        if: steps.done.outputs.cache-hit != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YY_TOOL: ${{ steps.pin.outputs.tool }}
          YY_COMMIT: ${{ steps.pin.outputs.commit }}
          YY_COMMUNITY: ${{ steps.pin.outputs.community }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::演练：没有机密 CLOUDFLARE_API_TOKEN，不上传。站点已存为构件「文档站」。"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx --yes wrangler@4.129.0 pages deploy 语言仓/dist/文档站 --project-name yuyan-docs --branch main \
            --commit-hash "$YY_COMMUNITY" --commit-dirty=true \
            --commit-message "语言仓 ${YY_COMMIT:0:9}（工具链 ${YY_TOOL:0:9}），社区包 ${YY_COMMUNITY:0:9}"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: 记下已发布的提交
        if: steps.deploy.outputs.uploaded == 'true'
        env:
          YY_RECORD: ${{ steps.pin.outputs.tool }} ${{ steps.pin.outputs.commit }} ${{ steps.pin.outputs.community }} ${{ steps.pin.outputs.url }} ${{ steps.pin.outputs.sha }}
        run: mkdir -p 文档站记号 && echo "$YY_RECORD" > 文档站记号/提交

      - uses: actions/cache/save@v4
        if: steps.deploy.outputs.uploaded == 'true'
        with:
          path: 文档站记号
          key: 文档站已发-${{ steps.pin.outputs.tool }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.community }}
