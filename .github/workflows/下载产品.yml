# 下载产品：工具链钉换了语言仓提交时，在 GitHub 托管运行机上编官网下载中心的编译器包与桌面包，挂到本仓库的连续发行 downloads-continuous。
# yuyan-lang.org 的下载中心只链本仓库发行里的文件（光盘见工作流「系统光盘」的 os-iso-continuous），云仓 CI 不再造下载产品（2026-10-16 起）。
# 触发与跳过同「系统光盘」：构建发布跑完、维护者推送改了工具链钉或手动触发；发行说明里的语言仓提交与钉相同就跳过（手动触发照造），
# 钉的提交还没有仓库目标「下载产品」也跳过。做法：准备工具链，直出一级原生豫构，跑语言仓的仓库目标「下载产品」（连带原生自举）。
# 资产名用 ASCII（GitHub 会改掉非 ASCII 字符）：yuyan-compiler-<系统>-<架构>.tar.gz 与 yuyan-desktop-<系统>-<架构>.tar.gz，
# 系统写 yuyan-os（豫言）、macos（苹果）、linux（林纳克斯）、windows（视窗），架构写 x86_64（兼容六十四）、aarch64（臂六十四）；另有 SHA256SUMS。
# 每轮覆盖上一版；新一轮来时取消还在跑的旧轮，只发最新的。
name: 下载产品

on:
  workflow_run:
    workflows: [构建发布]
    types: [completed]
  push:
    branches: [main]
    paths: ['工具链钉。数据。豫']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 下载产品
  cancel-in-progress: true

env:
  YY_DL_TAG: downloads-continuous

jobs:
  products:
    name: 编下载产品并发布
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: 读工具链钉，与上次发布的提交比较
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
          YY_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^「语言仓提交」者『\(.*\)』也。$/\1/p' 工具链钉。数据。豫)"
          last="$(gh release view "$YY_DL_TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null | sed -n 's/.*语言仓提交：\([0-9a-f]\{40\}\).*/\1/p' | head -n 1 || true)"
          echo "工具链钉的语言仓提交：$commit；上次发布：${last:-（无）}"
          if [ "$YY_EVENT" != workflow_dispatch ] && [ "$commit" = "$last" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备工具链
        id: prep
        if: steps.need.outputs.build == 'true'
        uses: ./.github/actions/准备工具链

      # 工具链钉还指着没有仓库目标「下载产品」的旧语言仓提交（2026-10-16 以前）时跳过。
      - name: 查语言仓有没有「下载产品」目标
        id: target
        if: steps.need.outputs.build == 'true'
        run: |
          if grep -q "于『下载产品』" 语言仓/应用/豫构/仓库目标。豫; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::工具链钉的语言仓提交还没有仓库目标「下载产品」，跳过"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 腾出磁盘空间
        if: steps.target.outputs.ok == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 直出一级原生豫构
        if: steps.target.outputs.ok == 'true'
        working-directory: 语言仓
        run: ./豫构稳定。林纳。豫行 构建 豫构 --输出 豫构。林纳。豫行 -j "$(nproc)" -- --目标 本机 --执行器 执行器。树码

      - name: 编编译器包与桌面包（仓库目标「下载产品」）
        if: steps.target.outputs.ok == 'true'
        working-directory: 语言仓
        run: ./豫构。林纳。豫行 目标 下载产品 -j "$(nproc)"

      - name: 命名资产，算 SHA-256
        if: steps.target.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p 产品
          sys() { case "$1" in 豫言) echo yuyan-os;; 苹果) echo macos;; 林纳克斯) echo linux;; 视窗) echo windows;; *) echo "::error::未知系统 $1" >&2; exit 1;; esac; }
          arch() { case "$1" in 兼容六十四) echo x86_64;; 臂六十四) echo aarch64;; *) echo "::error::未知架构 $1" >&2; exit 1;; esac; }
          for f in 语言仓/下载产品/*.tar.gz; do
            b="$(basename "$f" .tar.gz)"
            kind="${b%%-*}"; rest="${b#*-}"; s="${rest%%-*}"; a="${rest#*-}"
            case "$kind" in 编译器) k=compiler;; 桌面) k=desktop;; *) echo "::error::未知产品 $b"; exit 1;; esac
            mv "$f" "产品/yuyan-$k-$(sys "$s")-$(arch "$a").tar.gz"
          done
          (cd 产品 && sha256sum *.tar.gz > SHA256SUMS)
          cat 产品/SHA256SUMS
          ls -l 产品

      - name: 发布到连续发行
        if: steps.target.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YY_COMMIT: ${{ steps.prep.outputs.commit }}
        run: |
          set -euo pipefail
          notes="$(printf '%s\n' \
            "豫言下载产品（连续版），每次工具链钉换了语言仓提交就重编一次，覆盖上一版；yuyan-lang.org 的下载中心链的就是这里的文件。" \
            "" \
            "- 语言仓提交：$YY_COMMIT（https://github.com/yuyan-lang/yuyan/commit/$YY_COMMIT）" \
            "- 造法：语言仓仓库目标「下载产品」（./豫构。林纳。豫行 目标 下载产品）。" \
            "- yuyan-compiler-*：编译器包（整份源码加豫构、编译器与执行器汇编树码；程序名按系统取后缀，如 豫构。林纳。豫行，Windows 是 豫构.exe），系统 yuyan-os、macos、linux、windows，架构 x86_64、aarch64。" \
            "- yuyan-desktop-*：桌面包（编译器包加豫言工作台 豫言桌面（按系统取后缀）与文楷字体），系统 macos、linux、windows。" \
            "- 校验和见 SHA256SUMS；启动光盘见 os-iso-continuous。")"
          if gh release view "$YY_DL_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$YY_DL_TAG" -R "$GITHUB_REPOSITORY" --clobber 产品/*.tar.gz 产品/SHA256SUMS
            gh release edit "$YY_DL_TAG" -R "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$YY_DL_TAG" -R "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "豫言下载产品（连续版）" --notes "$notes" \
              产品/*.tar.gz 产品/SHA256SUMS
          fi
